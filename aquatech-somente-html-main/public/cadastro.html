<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaTech | Cadastro</title>

    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <div class="header">

        <div class="container header-container">

            <h1 class="titulo">AquaTech</h1>

            <ul class="navbar">

                <li>
                    <a class="link" href="index.html">Inicial</a>
                </li>

                <li>
                    <a class="link" href="simulador.html">Simulador</a>
                </li>

                <li>|</li>

                <li>
                    <a class="link" href="login.html">Login</a>
                </li>

                <li class="agora">
                    <a class="link" href="#">Cadastro</a>
                </li>

            </ul>

        </div>

    </div>

    <div class="login">

        <div class="container login-container">

            <div class="card-cadastro">

                <h2 class="titulo-card">Bem-vindo!</h2>

                <div class="formulario-cadastro">

                    <div class="campo">

                        <span class="nome-campo">Código de ativação:</span>

                        <input class="entrada" id="codigo_input" type="text" placeholder="Insira aqui seu código">

                    </div>

                    <div class="campo">

                        <span class="nome-campo">Nome:</span>

                        <input class="entrada" id="nome_input" type="text" placeholder="Seu nome">

                    </div>

                    <div class="campo">

                        <span class="nome-campo">E-mail:</span>

                        <input class="entrada" id="email_input" type="text" placeholder="meuemail@provedor.com">

                    </div>

                    <div class="campo">

                        <span class="nome-campo">Senha:</span>

                        <input class="entrada" id="senha_input" type="password" placeholder="******">

                    </div>

                    <div class="campo">

                        <span class="nome-campo">Confirmação da Senha:</span>

                        <input class="entrada" id="confirmacao_senha_input" type="password" placeholder="******">

                    </div>

                    <button class="botao">Cadastrar</button>

                </div>

            </div>

        </div>

    </div>

    <div class="footer-cadastro"></div>

</body>

</html>
